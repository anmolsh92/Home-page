<!doctype html>
<!-- Lead: 2 Doodle docs · Format: monochrome · Borrowed: none -->
<html lang="en" data-theme="monochrome">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Anmol Shrivastava</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Kalam:wght@300;400;700&family=Nanum+Pen+Script&family=Patrick+Hand+SC&family=Inter:wght@400;600&display=swap">
<style>
  :root{
    --paper:#ffffff; --paper-raised:#f5f5f3; --ink:#141414; --ink-muted:#555555; --rule:#141414;
    --accent:#141414; --on-accent:#ffffff; --marker:#e4e4e1; --pen:#141414; --stage:#efefec;
    --font-doodle:"Gloria Hallelujah",cursive; --font-hand:"Kalam","Patrick Hand",cursive;
    --font-pen:"Nanum Pen Script",cursive; --font-label:"Patrick Hand SC","Kalam",cursive;
    --font-sans:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:400 18px/28px var(--font-hand)}

  header{display:flex;justify-content:space-between;align-items:center;gap:16px;max-width:1080px;width:100%;margin:0 auto;padding:24px 32px;border-bottom:1px dashed var(--rule)}
  .wordmark{font:400 24px/1.2 var(--font-doodle);color:var(--ink);text-decoration:none;white-space:nowrap}
  .back{font:700 16px var(--font-hand);color:var(--ink);text-decoration:none;white-space:nowrap}
  .back:hover{text-decoration:underline}

  main{flex:1;display:grid;grid-template-columns:1fr 420px;gap:56px;align-items:center;max-width:1080px;width:100%;margin:0 auto;padding:56px 32px 80px}

  .intro .eyebrow{font:400 14px/18px var(--font-label);letter-spacing:.12em;color:var(--ink-muted);margin:0 0 12px}
  .intro h2{font:400 52px/1.25 var(--font-doodle);margin:0 0 16px}
  .hl{position:relative;display:inline-block;padding:0 8px;margin:0 -8px}
  .hl::before{content:"";position:absolute;inset:18% 0 12% 0;background:var(--marker);border-radius:3px 9px 4px 11px / 9px 3px 10px 4px;transform:rotate(-1.2deg);z-index:-1}
  .intro p{font:300 22px/32px var(--font-hand);color:var(--ink-muted);margin:0;max-width:420px}
  .doodle{position:relative;margin-top:24px;display:flex;align-items:flex-end;gap:8px}
  .person{width:180px;height:180px;color:var(--ink)}
  .pen-note{font:400 34px/32px var(--font-pen);color:var(--pen);margin:0 0 70px;display:flex;align-items:center;gap:6px}
  .arrow{width:64px;height:40px}

  .card{background:var(--paper-raised);border:2px solid var(--rule);border-radius:16px;padding:32px 32px 26px}
  .card h1{font:400 36px/1.3 var(--font-doodle);margin:0;display:inline-block;position:relative}
  .title-wrap{display:inline-block;margin-bottom:8px}
  .underline{display:block;width:calc(100% + 16px);height:14px;color:var(--ink);margin:-4px 0 0 -6px}
  .lead{margin:0 0 20px;color:var(--ink-muted);font-size:16px;line-height:24px}

  label{display:block;font:700 16px/22px var(--font-hand);margin:0 0 6px}
  input{width:100%;height:48px;padding:0 14px;margin:0 0 16px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);font:400 15px var(--font-sans)}
  input:focus{outline:2px solid var(--ink);outline-offset:2px}

  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;border-radius:9999px;cursor:pointer;font:700 17px/1 var(--font-hand)}
  .btn:focus-visible,.switch button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .btn-primary{background:var(--accent);color:var(--on-accent);border:2px solid var(--accent);margin-top:4px}
  .btn-primary:hover{background:#2b2b2b}
  .btn-outline{background:var(--paper);color:var(--ink);border:2px solid var(--ink)}
  .btn-outline:hover{background:var(--ink);color:var(--paper)}
  .btn[disabled]{opacity:.6;cursor:wait}

  .or{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--ink-muted);font:400 16px var(--font-label)}
  .or::before,.or::after{content:"";flex:1;border-top:1px dashed var(--rule)}

  .switch{margin:20px 0 0;padding-top:16px;border-top:1px dashed var(--rule);text-align:center;color:var(--ink-muted);font-size:16px}
  .switch button{background:none;border:0;padding:0;color:var(--ink);font:700 16px var(--font-hand);cursor:pointer;text-decoration:underline;text-decoration-style:wavy;text-underline-offset:4px}

  .msg{display:none;margin:0 0 16px;padding:10px 14px;border:1.5px dashed var(--ink);border-radius:10px;background:var(--paper);font:400 14px/20px var(--font-sans)}
  .msg.show{display:block}
  .msg.error{border-style:solid}

  @media (max-width:860px){
    main{grid-template-columns:1fr;gap:32px;padding:32px 20px 56px}
    .intro h2{font-size:40px}
    .doodle{display:none}
    .card{padding:26px 20px 22px}
  }
  @media (max-width:420px){
    header{padding:18px 20px}
    .wordmark{font-size:20px}
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Portfolio showcase project. The publishable key is safe to ship in the browser.
  const SUPABASE_URL = "https://yowvtdbqacltmilxkfsq.supabase.co";
  const SUPABASE_KEY = "sb_publishable_pD2ZF-OmCU5Ft1XPaslOOg_jnogHTWX";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Where to send people after login: /login?next=/crm-dashboard
  // Only same-site paths are allowed, so the page can't be used as an open redirect.
  function nextPath(){
    const n = new URLSearchParams(location.search).get("next") || "/";
    return (n.startsWith("/") && !n.startsWith("//") && !n.startsWith("/\\")) ? n : "/";
  }
  const NEXT = nextPath();
  const RETURN_URL = location.origin + "/login?next=" + encodeURIComponent(NEXT);
  const go = () => location.replace(NEXT);

  const $ = id => document.getElementById(id);
  let mode = "signin";

  function show(text, kind){ const m = $("msg"); m.textContent = text; m.className = "msg show " + kind; }
  function clear(){ $("msg").className = "msg"; }

  function setMode(m){
    mode = m; clear();
    const up = m === "signup";
    $("title").textContent = up ? "Create an account" : "Sign in";
    $("lead").textContent = up ? "Takes a few seconds. No card needed." : "Welcome back. Pick up where you left off.";
    $("submit").textContent = up ? "Create account" : "Sign in";
    $("switch-text").textContent = up ? "Already have an account?" : "New here?";
    $("switch").textContent = up ? "Sign in" : "Create an account";
    $("password").autocomplete = up ? "new-password" : "current-password";
  }
  $("switch").addEventListener("click", () => setMode(mode === "signin" ? "signup" : "signin"));

  // Already signed in (or just back from Google / email confirmation) → continue.
  sb.auth.getSession().then(({ data }) => { if (data.session) go(); });
  sb.auth.onAuthStateChange((event, session) => { if (session && event === "SIGNED_IN") go(); });

  $("google").addEventListener("click", async () => {
    clear();
    const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: RETURN_URL } });
    if (error) show(error.message, "error");
  });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault(); clear();
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email || !password) return show("Please enter your email and password.", "error");
    if (mode === "signup" && password.length < 6) return show("Use at least 6 characters for the password.", "error");

    const btn = $("submit"); btn.disabled = true;
    try {
      if (mode === "signin") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        go();
      } else {
        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: RETURN_URL } });
        if (error) throw error;
        if (data.session) go();
        else show("Check your inbox to confirm your email, then you'll be signed in.", "ok");
      }
    } catch (err) {
      show(err.message || "Something went wrong. Please try again.", "error");
    } finally {
      btn.disabled = false;
    }
  });
</script>
